name: Test and package

on:
  push:
    branches: [main, feature/acquisition-intelligence]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools and editable project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build
      - name: Run offline tests
        run: python -m pytest -q
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Check installed wheel in isolated environment
        run: |
          python -m venv /tmp/signaldesk-wheel-test
          /tmp/signaldesk-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/signaldesk-wheel-test/bin/python tests/smoke_installed.py
